<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="见词 WordSnap - 智能单词学习">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="见词">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>见词 WordSnap</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      background: #2F5CFF;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 120px;
      height: 120px;
    }
    /* Hide Flutter loader spinner */
    .loading {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="splash-logo.png" alt="见词" />
  </div>
  <script>
    // Hide splash after Flutter renders
    window.addEventListener('flutter-first-frame', function() {
      setTimeout(function() {
        var splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('fade-out');
          setTimeout(function() { splash.remove(); }, 300);
        }
      }, 100);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
